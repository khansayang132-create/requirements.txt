[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auravox"
version = "1.0.0"
description = "AURAVOX X: autonomous local voice production (engines, voices, dialogue, QA, queue, lip sync)"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "espeakng-loader>=0.2"]

[project.optional-dependencies]
piper = ["piper-tts[alignment]>=1.8"]
test = ["pytest>=8"]

[project.scripts]
avx = "auravox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
