[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dhfactory"
version = "1.0.0"
description = "Digital Human AI Factory: typed Python agents that turn a script into a checked talking-presenter video."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
elevenlabs = ["elevenlabs>=2.78,<3"]     # official SDK (github.com/elevenlabs/elevenlabs-python)
runway = ["runwayml>=5.27,<6"]           # official SDK (github.com/runwayml/sdk-python)
all = ["elevenlabs>=2.78,<3", "runwayml>=5.27,<6"]
dev = ["pytest>=9.2,<10", "ruff>=0.17,<0.18"]

[project.scripts]
dhfactory = "dhfactory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
