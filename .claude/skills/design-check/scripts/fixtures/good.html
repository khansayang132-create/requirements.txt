<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tide Tables</title>
<style>
  :root { --bg: #f6f8fa; --fg: #14202b; --muted: #4a5a68; --accent: #0b5cad; --on-accent: #ffffff; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1620; --fg: #e6edf3; --muted: #a3b1bf; --accent: #7cb7ff; --on-accent: #0e1620; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 system-ui, sans-serif; }
  main { max-width: 42rem; margin: 0 auto; padding: 2rem max(16px, env(safe-area-inset-left)); }
  p { color: var(--muted); }
  a, button { color: var(--accent); }
  button { min-height: 44px; padding: 0 1rem; border: 1px solid var(--accent); border-radius: 10px; background: transparent; font: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  table { border-collapse: collapse; width: 100%; } td, th { padding: .5rem; text-align: left; border-bottom: 1px solid color-mix(in srgb, var(--fg) 15%, transparent); }
</style>
</head>
<body>
<main>
  <h1>Tide tables</h1>
  <p>High and low water for the harbour this week, in metres above chart datum.</p>
  <h2>Monday</h2>
  <table><tr><th>Time</th><th>Height</th></tr><tr><td>06:12</td><td>4.1 m</td></tr><tr><td>18:40</td><td>0.6 m</td></tr></table>
  <p><button type="button">Next day</button></p>
</main>
</body>
</html>
