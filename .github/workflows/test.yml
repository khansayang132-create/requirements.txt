name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m py_compile bot.py
      - name: HarnessFlow generated files match the pack
        run: |
          (cd .github/HarnessFlow && python sync_agent_definitions.py)
          bash .github/HarnessFlow/cli_setup.sh > /dev/null
          test -z "$(git status --porcelain)" || { git status --short; echo "Run the two commands above and commit the result."; exit 1; }
      - run: pip install -r requirements.txt pytest bandit==1.8.6
      - run: python -m pytest -q tests
      - run: pip install ruff==0.17.2 && ruff check agency
      - run: shellcheck -S warning service/install.sh service/test-service.sh termux/install.sh termux/test-termux.sh scripts/agency-setup.sh scripts/site.sh

  service:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: bash service/test-service.sh

  termux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker run --rm --privileged -v "$PWD":/mnt/repo:ro termux/termux-docker:x86_64 bash /mnt/repo/termux/test-termux.sh

  apex:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    defaults:
      run:
        working-directory: apex
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Downloaded .deb files are cached between runs: the runner's default mirror has been slow
      # enough (~80 KB/s) to time the job out.
      - uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-noble-ffmpeg-espeak-ng-dejavu-v1
      - run: |
          # Main archive first, the runner's Azure mirror as fallback.
          printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:2\n' \
            | sudo tee /etc/apt/apt-mirrors.txt
          mkdir -p ~/apt-cache/partial
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-cache"
          # Cap each attempt so a hung mirror can't eat the job; partial downloads resume on retry.
          for i in 1 2 3; do
            sudo timeout 150 apt-get $apt_opts update && \
              sudo timeout 480 apt-get $apt_opts install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core && break
            [ "$i" = 3 ] && exit 1
            echo "apt attempt $i failed or hung; retrying"; sleep 10
          done
          sudo rm -rf ~/apt-cache/partial ~/apt-cache/lock
          sudo chown -R "$USER" ~/apt-cache
        timeout-minutes: 22
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  done:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: done
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: done/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint:ui
      - run: npx vite build

  promovent:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: promovent, POSTGRES_PASSWORD: ci, POSTGRES_DB: promovent_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U promovent" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      PROMOVENT_TEST_DATABASE_URL: postgresql+psycopg://promovent:ci@127.0.0.1:5432/promovent_test
      PROMOVENT_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    defaults:
      run:
        working-directory: promovent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q -rs tests

  promovent-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: promovent/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: promovent/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx next build

  promovent-docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: promovent
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t promovent-backend:ci .
      - run: docker build -t promovent-frontend:ci web
      - run: docker run --rm --entrypoint python promovent-backend:ci -c "import lightgbm, promovent.api; print('ok')"

  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i -g playwright@1.49.1 && npx -y playwright@1.49.1 install --with-deps chromium
      - run: node --test .claude/skills/design-check/scripts/check.test.mjs
