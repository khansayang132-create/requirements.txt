name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m py_compile bot.py
      - run: shellcheck -S warning service/install.sh service/test-service.sh termux/install.sh termux/test-termux.sh

  service:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: bash service/test-service.sh

  termux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker run --rm --privileged -v "$PWD":/mnt/repo:ro termux/termux-docker:x86_64 bash /mnt/repo/termux/test-termux.sh

  apex:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apex
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: |
          # A mirror can hang past apt's own timeouts, so cap each attempt and retry.
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for i in 1 2 3; do
            sudo timeout 150 apt-get $apt_opts update && \
              sudo timeout 240 apt-get $apt_opts install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core && break
            [ "$i" = 3 ] && exit 1
            echo "apt attempt $i failed or hung; retrying"; sleep 10
          done
        timeout-minutes: 14
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
