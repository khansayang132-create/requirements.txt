name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m py_compile bot.py
      - name: HarnessFlow generated files match the pack
        run: |
          (cd .github/HarnessFlow && python sync_agent_definitions.py)
          bash .github/HarnessFlow/cli_setup.sh > /dev/null
          test -z "$(git status --porcelain)" || { git status --short; echo "Run the two commands above and commit the result."; exit 1; }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - run: shellcheck -S warning service/install.sh service/test-service.sh termux/install.sh termux/test-termux.sh studio/run.sh studio/build.sh studio/test-studio.sh studio/test-studio-termux.sh

  service:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: bash service/test-service.sh

  termux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker run --rm --privileged -v "$PWD":/mnt/repo:ro termux/termux-docker:x86_64 bash /mnt/repo/termux/test-termux.sh

  # LSKhan Studio: prebuilt bundle is current, it builds, and run.sh serves it.
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m venv /tmp/studio-venv && /tmp/studio-venv/bin/pip install -q jac-client==0.3.25
      - run: PATH=/tmp/studio-venv/bin:$PATH bash studio/test-studio.sh --build

  # The same app on a real Termux userland: installs without llvmlite, serves without bun.
  studio-termux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker run --rm --privileged -v "$PWD":/mnt/repo:ro termux/termux-docker:x86_64 bash /mnt/repo/studio/test-studio-termux.sh

  apex:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    defaults:
      run:
        working-directory: apex
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Downloaded .deb files are cached between runs: the runner's default mirror has been slow
      # enough (~80 KB/s) to time the job out.
      - uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-noble-ffmpeg-espeak-ng-dejavu-v1
      - run: |
          # Main archive first, the runner's Azure mirror as fallback.
          printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:2\n' \
            | sudo tee /etc/apt/apt-mirrors.txt
          mkdir -p ~/apt-cache/partial
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-cache"
          # Cap each attempt so a hung mirror can't eat the job; partial downloads resume on retry.
          for i in 1 2 3; do
            sudo timeout 150 apt-get $apt_opts update && \
              sudo timeout 480 apt-get $apt_opts install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core && break
            [ "$i" = 3 ] && exit 1
            echo "apt attempt $i failed or hung; retrying"; sleep 10
          done
          sudo rm -rf ~/apt-cache/partial ~/apt-cache/lock
          sudo chown -R "$USER" ~/apt-cache
        timeout-minutes: 22
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
