name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m py_compile bot.py
      - run: shellcheck -S warning service/install.sh service/test-service.sh termux/install.sh termux/test-termux.sh

  service:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: bash service/test-service.sh

  termux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker run --rm --privileged -v "$PWD":/mnt/repo:ro termux/termux-docker:x86_64 bash /mnt/repo/termux/test-termux.sh

  apex:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    defaults:
      run:
        working-directory: apex
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Downloaded .deb files are cached between runs: the runner's default mirror has been slow
      # enough (~80 KB/s) to time the job out.
      - uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-noble-ffmpeg-espeak-ng-dejavu-v1
      - run: |
          # Main archive first, the runner's Azure mirror as fallback.
          printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:2\n' \
            | sudo tee /etc/apt/apt-mirrors.txt
          mkdir -p ~/apt-cache/partial
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-cache"
          # Cap each attempt so a hung mirror can't eat the job; partial downloads resume on retry.
          for i in 1 2 3; do
            sudo timeout 150 apt-get $apt_opts update && \
              sudo timeout 480 apt-get $apt_opts install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core && break
            [ "$i" = 3 ] && exit 1
            echo "apt attempt $i failed or hung; retrying"; sleep 10
          done
          sudo rm -rf ~/apt-cache/partial ~/apt-cache/lock
          sudo chown -R "$USER" ~/apt-cache
        timeout-minutes: 22
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  # The TaikaTranslator skill's starter kit: unit tests (Surefire), stub-server and
  # end-to-end fixture tests (Failsafe), and the visual-diff script's tests.
  # JDK 17 is the kit's declared floor (maven.compiler.release=17).
  taika-starter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .claude/skills/taikatranslator-engineering/starter
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: .claude/skills/taikatranslator-engineering/starter/pom.xml
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r vision/requirements.txt pytest==8.3.4
      - run: python -m compileall -q scripts vision src/test/resources/fixtures
      - run: python -m pytest -q -p no:cacheprovider scripts/tests vision/tests
      # VISION_REQUIRED turns "python missing" from a skip into a failure for the Java/Python contract tests.
      - run: mvn -B -ntp clean verify
        env:
          VISION_REQUIRED: "1"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taika-starter-evidence
          path: |
            .claude/skills/taikatranslator-engineering/starter/target/surefire-reports/
            .claude/skills/taikatranslator-engineering/starter/target/failsafe-reports/
            .claude/skills/taikatranslator-engineering/starter/target/e2e-evidence/
          if-no-files-found: warn

  # Visual gate for the starter kit (TSK-5.2.7): renders the end-to-end DOCX produced by
  # taika-starter with LibreOffice and compares it to the committed, reviewed baseline.
  # Separate job on purpose: structure tests passing never implies this passes.
  taika-visual:
    needs: taika-starter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .claude/skills/taikatranslator-engineering/starter
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: taika-starter-evidence
          path: .claude/skills/taikatranslator-engineering/starter/evidence
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:2\n' \
            | sudo tee /etc/apt/apt-mirrors.txt
          for i in 1 2 3; do
            sudo timeout 150 apt-get -o Acquire::Retries=3 update && \
              sudo timeout 600 apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                libreoffice-writer-nogui poppler-utils fonts-crosextra-carlito && break
            [ "$i" = 3 ] && exit 1
            echo "apt attempt $i failed; retrying"; sleep 10
          done
        timeout-minutes: 15
      - run: pip install pillow==11.1.0
      - run: soffice --version && pdftoppm -v 2>&1 | head -1 && fc-match Calibri
      - run: |
          python scripts/visual_diff.py compare evidence/e2e-evidence/service-agreement.ES.docx \
            --baseline src/test/resources/baselines/service-agreement.ES --out visual-out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taika-visual-diff
          path: .claude/skills/taikatranslator-engineering/starter/visual-out/
          if-no-files-found: warn
