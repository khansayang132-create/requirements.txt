[project]
name = "lskhan-studio"
version = "1.0.0"
description = "LSKhan Studio: TikTok hooks, scripts, captions and series for Cinta Beda Negara"
entry-point = "main.jac"

[dependencies.npm]
class-variance-authority = "^0.7.1"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
radix-ui = "^1.4.3"
"@hugeicons/core-free-icons" = "^3.1.1"
"@hugeicons/react" = "^1.1.5"
shadcn = "^3.8.5"
"@fontsource-variable/nunito-sans" = "*"
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
"@tailwindcss/vite" = "latest"
tailwindcss = "latest"
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[serve]
base_route_app = "app"

[plugins.client.app_meta_data]
title = "LSKhan Studio"
description = "Hook naskah caption dan series TikTok untuk LSKhan Cinta Beda Negara"
theme_color = "#e11d48"

[plugins.client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[plugins.client.configs.tailwind]
content = ["./src/**/*.{jac,tsx,jsx}"]

[jac-shadcn]
style = "vega"
baseColor = "stone"
theme = "rose"
font = "nunito-sans"
radius = "medium"
menuAccent = "subtle"
menuColor = "default"
registry = "https://jac-shadcn.jaseci.org"
